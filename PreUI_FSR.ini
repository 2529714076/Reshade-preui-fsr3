; ==============================================================================
;  PreUI_FSR.ini —— ReShade Pre-UI add-on (FSR 3) 配置文件
;
;  放到 ReShade_PreUI_FSR.addon64 旁边（也就是游戏 exe 所在目录）。
;  整个文件都可以不存在——缺失时全部使用下面的默认值。
;  改完不需要重装，重启游戏生效。
; ==============================================================================

[PreUI]

; 0 = 只加载 DLL，不安装任何 hook（排查「游戏启动不了」时先用这个）。
; 1 = 正常启用。
Enabled=1

; 第 N 帧之后才开始扫描模块并挂钩 FSR 升频器。
; 启动阶段挂钩容易和 loader lock / 反作弊扫描冲突，所以默认等到 120 帧。
DelayFrames=120

; 1 = 在 PreUI-FSR.log 里记录失败原因（最多 60 条，不会刷屏）。
Trace=1

; 1 = 首次标定 output 偏移时，把 FfxDispatchDescription 前 256 字节
;     hex dump 到日志里（只 dump 前 3 次）。
;     如果日志显示 "output not found"，把这段发出来就能人工校准偏移。
DumpDesc=1

; 人工校准用：填 FfxDispatchDescription 里 width 字段的字节偏移，
; 填了就不再自动标定。留空或 0 = 自动。
; 例：从日志的 hex dump 里数出 width 在第 216 字节，就写 OutputOffset=216
OutputOffset=0
